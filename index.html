<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku Game</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f2f2f2;
}

h1 {
  margin-top: 20px;
}

#board {
  width: 360px;
  max-width: 95vw;
  margin: 20px auto;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  border: 3px solid black;
}

.cell {
  aspect-ratio: 1;
  background: white;
  border: 1px solid #999;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cell:nth-child(3n) {
  border-right: 3px solid black;
}

.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54),
.cell:nth-child(n+73):nth-child(-n+81) {
  border-bottom: 3px solid black;
}

button {
  font-size: 18px;
  padding: 10px 20px;
  margin: 8px;
  border-radius: 8px;
  border: none;
  background: #333;
  color: white;
}
</style>
</head>

<body>

<h1>Sudoku</h1>

<div id="board"></div>

<button onclick="newGame()">New Game</button>

<script>

const puzzle = [
  5,3,0,0,7,0,0,0,0,
  6,0,0,1,9,5,0,0,0,
  0,9,8,0,0,0,0,6,0,

  8,0,0,0,6,0,0,0,3,
  4,0,0,8,0,3,0,0,1,
  7,0,0,0,2,0,0,0,6,

  0,6,0,0,0,0,2,8,0,
  0,0,0,4,1,9,0,0,5,
  0,0,0,0,8,0,0,7,9
];
 const solution = [
  5,3,4,6,7,8,9,1,2,
  6,7,2,1,9,5,3,4,8,
  1,9,8,3,4,2,5,6,7,
  8,5,9,7,6,1,4,2,3,
  4,2,6,8,5,3,7,9,1,
  7,1,3,9,2,4,8,5,6,
  9,6,1,5,3,7,2,8,4,
  2,8,7,4,1,9,6,3,5,
  3,4,5,2,8,6,1,7,9
]; 

function createBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  for (let i = 0; i < 81; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";

    if (puzzle[i] !== 0) {
      cell.textContent = puzzle[i];
      cell.style.fontWeight = "bold";
    } else {
      cell.textContent = "";
      cell.contentEditable = true;

      cell.addEventListener("input", function() {
  this.textContent = this.textContent.replace(/[^1-9]/g, "").slice(0,1);

  if (this.textContent !== "") {
    if (Number(this.textContent) === solution[i]) {
      this.style.color = "green";
    } else {
      this.style.color = "red";
    }
  }
        if (checkComplete()) {
  alert("🏆 Congratulations! You solved the Sudoku!");
  }
});
    }

    board.appendChild(cell);
  }
}
function checkComplete() {
  const cells = document.querySelectorAll(".cell");

  for (let i = 0; i < 81; i++) {
    if (cells[i].textContent != solution[i]) {
      return false;
    }
  }

  return true;
  }
function newGame() {
  createBoard();
}

createBoard();

</script>

</body>
</html>
